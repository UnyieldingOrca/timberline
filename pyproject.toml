[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timberline"
version = "0.1.0"
description = "Agentic log analysis for Loki"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "deepagents>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "black>=24.0",
    "ruff>=0.8",
]
all = ["timberline[dev]"]

[project.scripts]
timberline = "timberline.cli:cli"

[tool.setuptools.packages.find]
include = ["timberline*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests requiring Loki",
]
addopts = "-v --tb=short --strict-markers --color=yes -ra"
